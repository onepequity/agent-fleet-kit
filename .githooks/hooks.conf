# Configuration for .githooks/pre-commit and .githooks/commit-msg.
# Sourced as bash. Environment variables with the same names override these.
#
# Enable the hooks once per clone:  git config core.hooksPath .githooks

# Full-project typecheck. Empty means "no typecheck"; evidence is recorded as
# skipped, and a "typecheck: pass" claim will be rejected.
# Examples: "npm run typecheck --silent", "npx tsc --noEmit", "mypy .", "cargo check"
TYPECHECK_CMD=""

# Test runner. Receives the selected test files as arguments.
# Examples: "node --test", "npx vitest run", "npx jest", "pytest"
TEST_CMD="node --test"

# Staged files matching this regex count as source and trigger checks.
SOURCE_PATTERN='\.(ts|tsx|mts|cts|js|jsx|mjs|cjs)$'

# Staged files matching this regex are tests and always run themselves.
TEST_PATTERN='\.test\.(ts|tsx|mts|cts|js|jsx|mjs|cjs)$'

# Where to look for the adjacent test of a staged source file.
# Placeholders: {dir} {base} {ext}. Space separated.
TEST_CANDIDATES='{dir}/{base}.test.{ext} {dir}/__tests__/{base}.test.{ext}'

# Secret scan of the staged diff with gitleaks:
#   auto     run if gitleaks is installed, warn if not
#   required fail the commit if gitleaks is not installed
#   off      do not run (CI still scans)
SECRET_SCAN=auto

# Seconds a "pass" evidence file stays valid for the commit-msg hook.
EVIDENCE_MAX_AGE=120

# Optional file listing allowed Verification scope ids, one per line
# (blank lines and # comments ignored). Empty means any non-empty scope.
SCOPE_REGISTRY=""
