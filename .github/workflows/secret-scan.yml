name: Secret scan

# Server-side backstop for the pre-commit secret scan. Catches commits made
# with --no-verify or from clones without the hooks installed.
#
# Uses the gitleaks binary directly (MIT licensed, no action license key).
# Add a .gitleaks.toml at the repo root to tune rules or allowlist known fakes.

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Determine commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          if [[ "$EVENT" == "pull_request" ]]; then
            range="${PR_BASE_SHA}..HEAD"
          elif [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "$zero" ]]; then
            range="${PUSH_BEFORE}..HEAD"
          else
            range=""   # new branch: scan full history
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Scanning range: ${range:-full history}"

      - name: Run gitleaks
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          args=(git . --no-banner --redact --exit-code 1)
          if [[ -n "$RANGE" ]]; then
            args+=(--log-opts="$RANGE")
          fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}"
